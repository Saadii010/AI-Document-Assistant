name: AI Personal Knowledge Assistant CI/CD

on:
  push:
    branches: [ main, master, production ]
  pull_request:
    branches: [ main, master ]

jobs:
  # =========================================================
  # Job 1: Diagnostics (Linting & Type-Checking)
  # =========================================================
  diagnose:
    name: Diagnostics and Quality Check
    runs-on: ubuntu-latest
    steps:
      - name: Check out Repository
        uses: actions/checkout@v4

      - name: Set up Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Project Dependencies
        run: npm ci

      - name: Run ESLint & TypeScript Type Check
        run: npm run lint

  # =========================================================
  # Job 2: Code Compilation and Bundling
  # =========================================================
  compile:
    name: Build Client and Server Bundles
    runs-on: ubuntu-latest
    needs: diagnose
    steps:
      - name: Check out Repository
        uses: actions/checkout@v4

      - name: Set up Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Project Dependencies
        run: npm ci

      - name: Build Application (Vite Frontend & esbuild Backend)
        run: npm run build
        env:
          NODE_ENV: production

      - name: Archive Production Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: compiled-assets
          path: dist/
          retention-days: 7

  # =========================================================
  # Job 3: Docker Images compilation validation
  # =========================================================
  dockerize:
    name: Docker Image Build Validation
    runs-on: ubuntu-latest
    needs: compile
    steps:
      - name: Check out Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production-unified image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false # Validate compilation only (enable push: true with login actions)
          tags: personal-knowledge-assistant:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build standalone backend microservice image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.backend
          push: false
          tags: personal-knowledge-assistant-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
